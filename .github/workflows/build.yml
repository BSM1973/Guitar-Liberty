name: Build Guitar Liberty

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run pack:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Guitar-Liberty-macOS-arm64
          path: release/Guitar Liberty-darwin-arm64
          if-no-files-found: error

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: Guitar-Liberty-Windows-x64
          path: release/Guitar Liberty-win32-x64
          if-no-files-found: error
