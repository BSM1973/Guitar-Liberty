name: Build Guitar Liberty

on:
  push:
    branches: [main, 'feature/redo-overlap-correction-1215']
  workflow_dispatch:

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run pack:mac
      
      - name: Intégrer les licences Chromium
        run: |
          DIST="release/Guitar Liberty-darwin-arm64"
          APP="$DIST/Guitar Liberty.app"
          test -f "$DIST/LICENSES.chromium.html"
          mkdir -p "$APP/Contents/Resources"
          cp "$DIST/LICENSES.chromium.html" "$APP/Contents/Resources/"

      - uses: actions/upload-artifact@v4
        with:
          name: Guitar-Liberty-macOS-arm64
          path: release/Guitar Liberty-darwin-arm64
          if-no-files-found: error
          retention-days: 30

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: Guitar-Liberty-Windows-x64
          path: release/Guitar Liberty-win32-x64
          if-no-files-found: error
          retention-days: 30
