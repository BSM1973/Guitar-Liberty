<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
.splash{width:100%;text-align:center;opacity:0;transform:scale(.96);animation:enter .65s ease-out forwards}
.mark{display:inline-flex;align-items:center;justify-content:center;width:82px;height:82px;border:3px solid #fff;border-radius:50%;font-size:34px;font-weight:900;font-style:italic;letter-spacing:-5px;margin-bottom:12px;filter:drop-shadow(0 0 18px rgba(255,255,255,.16))}
.name{font-family:"Snell Roundhand","Brush Script MT","Segoe Script",cursive;font-size:86px;font-weight:700;line-height:.9;letter-spacing:-3px;text-shadow:0 0 22px rgba(255,255,255,.12)}
.name small{display:block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;font-weight:700;letter-spacing:.42em;margin-top:24px;opacity:.66}
@keyframes enter{to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="splash">
 <div class="mark">GL</div>
 <div class="name">Guitare Liberty<small>S'ENTRAÎNER · JOUER · PROGRESSER</small></div>
</div>
</body>
</html>
